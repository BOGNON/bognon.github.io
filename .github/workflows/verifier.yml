# Vérifie le site à chaque envoi sur GitHub (gratuit pour un dépôt public).
# La publication elle-même est faite par GitHub Pages depuis le dossier docs/.
name: Vérifier le site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
